<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Industry Portal - AyushConnect</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <style>
      .hidden-section {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4 shadow-sm">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-building"></i> AyushConnect
        <span class="badge bg-success ms-2">Industry Recruiter</span>
      </a>
    </nav>

    <div class="container my-5">
      <!-- LOGIN -->
      <div id="indAuthSection" class="row justify-content-center">
        <div class="col-md-5">
          <div class="card border-0 shadow-lg p-4 rounded-4">
            <h4 class="fw-bold text-dark text-center mb-3">Recruiter Access</h4>
            <form onsubmit="handleIndLogin(event)">
              <div class="mb-3">
                <label class="form-label fw-bold small"
                  >Company Corporate ID</label
                >
                <input
                  type="text"
                  id="indIdInput"
                  class="form-control"
                  placeholder="e.g., CORP-IND-9021"
                  required
                />
                <div
                  class="d-flex justify-content-between align-items-center mt-2"
                >
                  <small class="text-muted">Need Demo Recruiter ID?</small>
                  <button
                    type="button"
                    class="btn btn-sm btn-outline-dark"
                    onclick="autoFillDemoIndustry()"
                  >
                    <i class="bi bi-magic me-1"></i> Auto-Fill Demo ID
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-dark w-100 fw-bold">
                Login to Recruiter Portal
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- MAIN DASHBOARD -->
      <div id="indDashboardSection" class="hidden-section">
        <div class="row g-4">
          <!-- Post New Opportunity Form -->
          <div class="col-md-5">
            <div class="card border-0 shadow-sm p-4 rounded-4">
              <h5 class="fw-bold text-success mb-3">
                <i class="bi bi-plus-square me-2"></i>Post New Internship / Job
              </h5>
              <form onsubmit="postNewJob(event)">
                <div class="mb-3">
                  <label class="form-label small fw-bold">Job Title</label>
                  <input
                    type="text"
                    id="postTitle"
                    class="form-control"
                    placeholder="e.g., Senior Herbal Analyst"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold">Company Name</label>
                  <input
                    type="text"
                    id="postCompany"
                    class="form-control"
                    value="Patanjali Research Institute"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold">Location</label>
                  <input
                    type="text"
                    id="postLoc"
                    class="form-control"
                    placeholder="Haridwar"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold"
                    >Stipend / Salary</label
                  >
                  <input
                    type="text"
                    id="postStipend"
                    class="form-control"
                    placeholder="₹14,000/mo"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold"
                    >Primary Required Skill</label
                  >
                  <select id="postSkill" class="form-select">
                    <option>Herbal Extraction</option>
                    <option>Quality Control (QC)</option>
                    <option>Good Clinical Practice (GCP)</option>
                    <option>Pharmacovigilance</option>
                    <option>HPLC Analysis</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">
                  Publish Requirement Live
                </button>
              </form>
            </div>
          </div>

          <!-- Live Posted Jobs Display -->
          <div class="col-md-7">
            <div class="card border-0 shadow-sm p-4 rounded-4">
              <h5 class="fw-bold text-dark mb-3">
                <i class="bi bi-broadcast me-2 text-success"></i>Live Active
                Postings
              </h5>
              <div id="postedJobsContainer"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function autoFillDemoIndustry() {
        document.getElementById("indIdInput").value = "CORP-IND-9021";
      }

      function handleIndLogin(e) {
        e.preventDefault();
        document
          .getElementById("indAuthSection")
          .classList.add("hidden-section");
        document
          .getElementById("indDashboardSection")
          .classList.remove("hidden-section");
        renderPostedJobs();
      }

      function postNewJob(e) {
        e.preventDefault();

        const currentJobs =
          JSON.parse(localStorage.getItem("ayush_job_postings")) || [];

        const newJob = {
          id: Date.now(),
          title: document.getElementById("postTitle").value,
          company: document.getElementById("postCompany").value,
          loc: document.getElementById("postLoc").value,
          stipend: document.getElementById("postStipend").value,
          skills: [document.getElementById("postSkill").value],
        };

        currentJobs.unshift(newJob);
        localStorage.setItem("ayush_job_postings", JSON.stringify(currentJobs));

        alert(
          "Opportunity Published! It is now instantly synced and live on the Student Portal.",
        );
        e.target.reset();
        renderPostedJobs();
      }

      function renderPostedJobs() {
        const container = document.getElementById("postedJobsContainer");
        const currentJobs =
          JSON.parse(localStorage.getItem("ayush_job_postings")) || [];

        container.innerHTML = currentJobs
          .map(
            (j) => `
        <div class="card p-3 mb-2 border-0 bg-light">
          <div class="d-flex justify-content-between">
            <h6 class="fw-bold mb-1">${j.title}</h6>
            <span class="badge bg-success">Active</span>
          </div>
          <small class="text-muted">${j.company} • ${j.loc} • ${j.stipend}</small>
          <div class="mt-2"><span class="badge bg-light text-dark border">Skill: ${j.skills.join(", ")}</span></div>
        </div>
      `,
          )
          .join("");
      }
    </script>
  </body>
</html>
